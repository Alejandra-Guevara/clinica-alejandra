---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: historia-clinica-db
  namespace: maria-guevara-rio-dev
  labels:
    app.kubernetes.io/part-of: clinica-alejandra-app
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: historia-clinica-db
  template:
    metadata:
      labels:
        app: historia-clinica-db
        app.kubernetes.io/part-of: clinica-alejandra-app
    spec:
      containers:
        - name: mysql
          image: quay.io/sclorg/mysql-84-c9s:20261118
          command: [/bin/bash, -ec]
          args:
            - |
              # Configuración incorporada: no hay variables que crear en la consola.
              export MYSQL_ROOT_PASSWORD='ClinicaSoloDemoRoot2026A'
              export MYSQL_MAX_CONNECTIONS=50
              export MYSQL_INNODB_BUFFER_POOL_SIZE=64M
              export MYSQL_KEY_BUFFER_SIZE=8M
              export MYSQL_READ_BUFFER_SIZE=1M
              exec run-mysqld
          ports:
            - name: mysql
              containerPort: 3306
          volumeMounts:
            - name: data
              mountPath: /var/lib/mysql/data
            - name: init
              mountPath: /opt/app-root/src/mysql-init
              readOnly: true
          startupProbe:
            tcpSocket: {port: mysql}
            periodSeconds: 5
            failureThreshold: 120
          readinessProbe:
            tcpSocket: {port: mysql}
            periodSeconds: 10
          livenessProbe:
            tcpSocket: {port: mysql}
            periodSeconds: 20
            failureThreshold: 6
          securityContext:
            runAsNonRoot: true
            allowPrivilegeEscalation: false
            capabilities: {drop: [ALL]}
            seccompProfile: {type: RuntimeDefault}
          resources:
            requests: {cpu: 100m, memory: 256Mi}
            limits: {cpu: '1', memory: 768Mi}
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: historia-clinica-mysql-data
        - name: init
          configMap:
            name: historia-clinica-mysql-init
---
apiVersion: v1
kind: Service
metadata:
  name: historia-clinica-db
  namespace: maria-guevara-rio-dev
spec:
  selector:
    app: historia-clinica-db
  ports:
    - name: mysql
      port: 3306
      targetPort: mysql
