# Panel opcional para consultar las tablas. No contiene datos persistentes.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: clinica-db-admin
  namespace: maria-guevara-rio-dev
  labels:
    app.kubernetes.io/part-of: clinica-alejandra-app
spec:
  replicas: 1
  selector:
    matchLabels:
      app: clinica-db-admin
  template:
    metadata:
      labels:
        app: clinica-db-admin
        app.kubernetes.io/part-of: clinica-alejandra-app
    spec:
      containers:
        - name: adminer
          image: docker.io/library/adminer:6.3.0-standalone
          # Omite los enlaces de temas/plugins del entrypoint: funciona con UID
          # aleatorio de OpenShift sin escribir en /var/www/html.
          command: [php]
          args: [-d, session.save_path=/tmp, -S, '0.0.0.0:8080', -t, /var/www/html]
          ports:
            - name: http
              containerPort: 8080
          readinessProbe:
            httpGet: {path: /, port: http}
            initialDelaySeconds: 3
            periodSeconds: 10
          livenessProbe:
            tcpSocket: {port: http}
            initialDelaySeconds: 20
            periodSeconds: 20
          securityContext:
            runAsNonRoot: true
            allowPrivilegeEscalation: false
            capabilities: {drop: [ALL]}
            seccompProfile: {type: RuntimeDefault}
          resources:
            requests: {cpu: 25m, memory: 64Mi}
            limits: {cpu: 250m, memory: 256Mi}
---
apiVersion: v1
kind: Service
metadata:
  name: clinica-db-admin
  namespace: maria-guevara-rio-dev
spec:
  selector:
    app: clinica-db-admin
  ports:
    - name: http
      port: 8080
      targetPort: http
---
apiVersion: route.openshift.io/v1
kind: Route
metadata:
  name: clinica-db-admin
  namespace: maria-guevara-rio-dev
spec:
  to: {kind: Service, name: clinica-db-admin}
  port: {targetPort: http}
  tls:
    termination: edge
    insecureEdgeTerminationPolicy: Redirect
